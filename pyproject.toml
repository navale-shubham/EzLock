[project]
name = "ezlock"
version = "1.0.0"
description = "Password-based folder encryption using AES-256-GCM + PBKDF2"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.1",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "auto-py-to-exe>=2.50.1",
    "pyrefly>=1.2.0",
]
